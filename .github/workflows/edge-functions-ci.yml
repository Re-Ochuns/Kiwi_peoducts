name: Edge Functions CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-functions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-functions:
    name: edge-functions-deno-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        run: deno check label-pdf/index.ts calendar-sync/index.ts
      - name: Run edge function tests
        run: deno test --allow-read tests/
