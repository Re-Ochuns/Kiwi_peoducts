name: Flutter CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Generate Golden references on the canonical Ubuntu runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/kiwi_inventory

jobs:
  quality:
    name: flutter-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --exclude-tags golden

  golden:
    name: flutter-golden
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Update Golden reference images
        if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
        run: flutter test --update-goldens test/home_golden_test.dart
      - name: Run Golden tests
        id: golden-tests
        run: flutter test test/home_golden_test.dart
      - name: Upload Golden failure images
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-test-failures-${{ github.sha }}
          path: apps/kiwi_inventory/test/failures
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Golden reference images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-reference-${{ github.sha }}
          path: apps/kiwi_inventory/test/goldens
          if-no-files-found: error
          retention-days: 7

  web-build:
    name: flutter-web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build web application
        run: flutter build web --release
      - name: Upload web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kiwi-inventory-web-${{ github.sha }}
          path: apps/kiwi_inventory/build/web
          if-no-files-found: error
          retention-days: 7
