name: Database CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - ".env.example"
      - "supabase/**"
      - ".github/workflows/database-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - ".env.example"
      - "supabase/**"
      - ".github/workflows/database-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-tests:
    name: Migration, RLS tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder-client-id
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local database
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Lint database schemas
        run: supabase db lint --local
