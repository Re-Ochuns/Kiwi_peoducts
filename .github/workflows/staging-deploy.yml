name: Staging Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  validate-source:
    name: validate-staging-source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require develop branch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$SOURCE_REF" != "refs/heads/develop" ]; then
            echo "Staging deployments must run from the develop branch."
            exit 1
          fi

  deploy:
    name: deploy-staging
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/kiwi_inventory
        run: flutter pub get
      - name: Build staging web application
        working-directory: apps/kiwi_inventory
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$STAGING_SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$STAGING_SUPABASE_PUBLISHABLE_KEY"
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.117.0
      - name: Link staging Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply pending database migrations
        run: supabase db push --linked --include-all
      - name: Deploy Firebase Hosting staging channel
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: staging
          expires: 30d
