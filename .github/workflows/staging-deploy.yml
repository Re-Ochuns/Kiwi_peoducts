name: Staging Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  validate-source:
    name: validate-staging-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require develop and successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/staging_preflight.py ci
      - name: Test deployment guards
        run: python3 -m unittest discover -s scripts -p 'test_staging_*.py'
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Edge CI is path-filtered; test the exact code being deployed here.
      - name: Check and test Edge Functions
        working-directory: supabase/functions
        run: |
          deno check label-pdf/index.ts calendar-sync/index.ts todo-notify/index.ts
          deno test --allow-read tests/

  deploy:
    name: deploy-staging
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      # Only for local config parsing. Dashboard manages hosted Auth;
      # this workflow never runs "supabase config push".
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: config-not-pushed
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: config-not-pushed
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate staging target and client-safe key
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: python3 scripts/staging_preflight.py
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.117.0
      - name: Verify calendar secrets before changing remote state
        run: |
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json > "$RUNNER_TEMP/edge-secret-names.json"
          python3 scripts/staging_preflight.py edge-secrets "$RUNNER_TEMP/edge-secret-names.json"
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/kiwi_inventory
        run: flutter pub get
      - name: Build staging web application
        working-directory: apps/kiwi_inventory
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$STAGING_SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$STAGING_SUPABASE_PUBLISHABLE_KEY"
      - name: Record build identity
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              "commit": os.environ["GITHUB_SHA"],
              "run": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "firebase_project": os.environ["FIREBASE_PROJECT_ID"],
              "supabase_project": os.environ["SUPABASE_PROJECT_REF"],
          }
          Path("apps/kiwi_inventory/build/web/deployment.json").write_text(json.dumps(record) + "\n")
          PY
      - name: Preserve the staging build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/kiwi_inventory/build/web
          if-no-files-found: error
          retention-days: 7
      - name: Link staging Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Inspect pending migrations
        run: supabase db push --linked --dry-run
      - name: Apply pending database migrations
        run: supabase db push --linked
      - name: Deploy label PDF function including Japanese font
        run: supabase functions deploy label-pdf --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy calendar synchronization function
        run: supabase functions deploy calendar-sync --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Discord ToDo notification function
        run: supabase functions deploy todo-notify --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Firebase Hosting staging project
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
      - name: Verify deployed identity and unauthenticated boundaries
        run: python3 scripts/staging_smoke.py
      - name: Record deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "## Staging deployment"
            echo "- Result: $RESULT"
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: https://$FIREBASE_PROJECT_ID.web.app"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Google OAuth, user approval, PDF/CSV/calendar and rollback require the acceptance record."
          } >> "$GITHUB_STEP_SUMMARY"
